name: Build iOS IPA (Free, No Dev Account)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node_version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Install Project Dependencies
        working-directory: mobile
        run: npm install

      - name: Expo Prebuild (Generate native iOS project)
        working-directory: mobile
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install

      - name: Build Xcode Archive (Code Signing Bypassed)
        working-directory: mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "Aura" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package App into .ipa
        working-directory: mobile/ios
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r Aura.ipa Payload/
          rm -rf Payload

      - name: Upload .ipa to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Aura-iOS-IPA
          path: mobile/ios/Aura.ipa
          retention-days: 14
